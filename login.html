<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Personal Finance Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="login-form" onsubmit="event.preventDefault();">
      <div class="input-group">
        <input type="email" id="login-email" placeholder="Email" required>
      </div>
      
      <div class="input-group" style="position: relative;">
        <input type="password" id="login-password" placeholder="Password" required>
        <span onclick="togglePassword('login-password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer;">👁️</span>
      </div>

      <div style="text-align: right; margin: 5px 0 15px 0;">
        <a href="#" onclick="handleForgotPassword()" style="font-size: 0.85rem; color: #007bff; text-decoration: none;">Forgot Password?</a>
      </div>

      <button type="submit" onclick="loginUser()">Login</button>
    </form>
    <p style="margin-top: 15px;">Don't have an account? <a href="register.html">Register here</a></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
