<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance Management - Login</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8f9fa; margin: 0; }
    .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
    h1 { font-size: 1.5rem; color: #2c3e50; margin-bottom: 0.5rem; }
    h2 { font-size: 1.25rem; color: #333; margin-bottom: 1.5rem; font-weight: 600; }
    .form-group { text-align: left; margin-bottom: 1.2rem; position: relative; }
    label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 0.4rem; color: #111; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.95rem; outline: none; }
    input:focus { border-color: #2c3e50; }
    .toggle-icon { position: absolute; right: 12px; top: 38px; cursor: pointer; user-select: none; font-size: 0.9rem; }
    .forgot-link { text-align: right; margin-top: -0.5rem; margin-bottom: 1.2rem; }
    .forgot-link a { font-size: 0.85rem; color: #3498db; text-decoration: none; }
    .forgot-link a:hover { text-decoration: underline; }
    button { width: 100%; padding: 11px; background-color: #2f4356; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:hover { background-color: #1f2d3a; }
    .footer-text { margin-top: 1.5rem; font-size: 0.9rem; color: #333; }
    .footer-text a { color: #111; font-weight: bold; text-decoration: underline; }
  </style>

  <!-- Firebase v9 Compat Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="card">
    <h1>Personal Finance<br>Management</h1>
    <h2>Login to App</h2>

    <div class="form-group">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="Enter your password" required>
      <span class="toggle-icon" onclick="togglePassword('login-password', this)">👁️</span>
    </div>

    <div class="forgot-link">
      <a href="#" onclick="handleForgotPassword(); return false;">Forgot Password?</a>
    </div>

    <button onclick="loginUser()">Login</button>

    <div class="footer-text">
      Don't have an account? <a href="register.html">Sign Up</a>
    </div>
  </div>

  <script src="script.js?v=5.0"></script>
</body>
</html>
