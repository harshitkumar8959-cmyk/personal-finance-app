<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Personal Finance Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .auth-card { background: #ffffff; padding: 35px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    .auth-card h2 { color: #2c3e50; font-size: 22px; margin-bottom: 8px; }
    .auth-card h3 { color: #34495e; font-size: 18px; font-weight: 500; margin-bottom: 25px; }

    .form-group { margin-bottom: 18px; text-align: left; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #2c3e50; margin-bottom: 6px; }
    
    .input-wrapper { position: relative; width: 100%; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; outline: none; background-color: #f8f9fa; }
    .form-group input:focus { border-color: #3498db; background-color: #fff; }

    .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 16px; user-select: none; }

    .forgot-link { display: block; text-align: right; font-size: 13px; color: #3498db; text-decoration: none; margin-top: -8px; margin-bottom: 20px; font-weight: 500; cursor: pointer; }
    .forgot-link:hover { text-decoration: underline; }

    .btn-submit { width: 100%; background-color: #2c3e50; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background-color: #1a252f; }

    .footer-text { margin-top: 20px; font-size: 13px; color: #7f8c8d; }
    .footer-text a { color: #2c3e50; font-weight: bold; text-decoration: none; }
    .footer-text a:hover { text-decoration: underline; }
  </style>

  <!-- ALL THREE FIREBASE SDKs IN CORRECT ORDER -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="auth-card">
    <h2>Personal Finance Management</h2>
    <h3>Login to App</h3>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="login-password" placeholder="Enter password" required>
          <span class="toggle-password" onclick="togglePasswordVisibility('login-password')">👁️</span>
        </div>
      </div>

      <a type="button" class="forgot-link" onclick="handleForgotPassword()">Forgot Password?</a>

      <button type="submit" class="btn-submit" id="login-btn">Login</button>
    </form>

    <div class="footer-text">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
  </div>

  <script src="script.js?v=999"></script>
</body>
</html>
