<!DOCTYPE html>
<html>
<head>
    <title>Login - Personal Finance App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase CDN SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="dashboard" style="max-width: 400px; margin: 80px auto; text-align: center;">
        <h2 id="form-title">Login to App</h2>
        
        <input type="email" id="auth-email" placeholder="Email Address" style="width: 90%; padding: 10px; margin: 8px 0;"><br>
        <input type="password" id="auth-password" placeholder="Password" style="width: 90%; padding: 10px; margin: 8px 0;"><br><br>

        <button id="auth-btn" onclick="handleAuth()" style="width: 95%; padding: 10px; background: #2ea44f; color: white; border: none; cursor: pointer; border-radius: 4px;">Login</button>

        <p style="margin-top: 15px;">
            <span id="toggle-msg">Don't have an account?</span> 
            <a href="#" onclick="toggleMode()" id="toggle-btn" style="color: #0066cc;">Sign Up</a>
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
