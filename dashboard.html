<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Personal Finance Manager</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --heading-color: #2c3e50;
      --subtext-color: #7f8c8d;
      --border-color: #dddddd;
      --item-bg: #f8f9fa;
      --shadow: rgba(0, 0, 0, 0.05);
    }

    body.dark-theme {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --heading-color: #ffffff;
      --subtext-color: #a0a0a0;
      --border-color: #333333;
      --item-bg: #2a2a2a;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 18px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px var(--shadow);
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 20px;
      color: var(--heading-color);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-email {
      font-weight: 600;
      color: var(--subtext-color);
      font-size: 14px;
    }

    .dark-mode-toggle {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .logout-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .logout-btn:hover { background-color: #c0392b; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px var(--shadow);
    }

    .card h3 {
      font-size: 13px;
      color: var(--subtext-color);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .card p {
      font-size: 24px;
      font-weight: bold;
    }

    .balance-card p { color: var(--heading-color); }
    .income-card p { color: #2ecc71; }
    .expense-card p { color: #e74c3c; }

    .budget-card, .goals-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px var(--shadow);
      margin-bottom: 25px;
    }

    .budget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .budget-inputs, .goal-inputs {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .budget-inputs input, .goal-inputs input {
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      border-radius: 6px;
      outline: none;
    }

    .budget-progress-bg {
      width: 100%;
      height: 12px;
      background-color: var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }

    .budget-progress-bar {
      height: 100%;
      width: 0%;
      background-color: #2ecc71;
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    /* Savings Goals Cards Grid */
    .goals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .goal-item {
      background: var(--item-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .goal-title {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--heading-color);
    }

    .goal-progress-bg {
      height: 8px;
      background: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0;
    }

    .goal-progress-bar {
      height: 100%;
      background: #3498db;
      width: 0%;
      transition: width 0.4s ease;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .form-card, .list-card, .chart-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px var(--shadow);
    }

    .section-title {
      font-size: 18px;
      color: var(--heading-color);
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--subtext-color);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    .add-btn {
      width: 100%;
      background-color: #3498db;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .add-btn:hover { background-color: #2980b9; }

    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .filter-bar select, .filter-bar input, .filter-bar button {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      border-radius: 6px;
      font-size: 13px;
    }

    .export-btn {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .transaction-list { list-style: none; }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      border-radius: 8px;
      background: var(--item-bg);
      margin-bottom: 10px;
      border-left: 5px solid #ccc;
    }

    .transaction-item.income { border-left-color: #2ecc71; }
    .transaction-item.expense { border-left-color: #e74c3c; }

    .item-title {
      font-weight: 600;
      color: var(--heading-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-meta { font-size: 11px; color: var(--subtext-color); margin-top: 2px; }
    .item-amount { font-weight: bold; }
    .item-amount.income { color: #2ecc71; }
    .item-amount.expense { color: #e74c3c; }

    .delete-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-left: 10px;
    }

    .chart-wrapper {
      position: relative;
      height: 260px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <!-- Chart.js Engine -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="header">
    <h1>Personal Finance Dashboard</h1>
    <div class="user-info">
      <button class="dark-mode-toggle" id="theme-toggle-btn" onclick="toggleDarkMode()">🌙 Dark</button>
      <span class="user-email" id="user-email-display">Loading...</span>
      <button class="logout-btn" onclick="logoutUser()">Logout</button>
    </div>
  </div>

  <div class="summary-grid">
    <div class="card balance-card">
      <h3>Total Balance</h3>
      <p id="total-balance">₹0.00</p>
    </div>
    <div class="card income-card">
      <h3>Total Income</h3>
      <p id="total-income">₹0.00</p>
    </div>
    <div class="card expense-card">
      <h3>Total Expense</h3>
      <p id="total-expense">₹0.00</p>
    </div>
  </div>

  <!-- Monthly Budget Card -->
  <div class="budget-card">
    <div class="budget-header">
      <div>
        <h3 style="color: var(--heading-color); font-size: 16px;">Monthly Expense Budget</h3>
        <span id="budget-status" style="font-size: 12px; color: var(--subtext-color);">Set target budget for current month</span>
      </div>
      <div class="budget-inputs">
        <input type="number" id="monthly-budget-input" placeholder="e.g. 15000" style="width: 130px;">
        <button onclick="saveMonthlyBudget()" style="padding: 8px 14px; cursor: pointer; border-radius: 6px; background: #3498db; color: white; border: none; font-weight: bold;">Set</button>
      </div>
    </div>
    <div class="budget-progress-bg">
      <div class="budget-progress-bar" id="budget-progress-bar"></div>
    </div>
  </div>

  <!-- Savings Goals Tracker Section -->
  <div class="goals-card">
    <h3 style="color: var(--heading-color); font-size: 16px; margin-bottom: 12px;">🎯 Savings Goals Tracker</h3>
    <form class="goal-inputs" onsubmit="addSavingsGoal(event)">
      <input type="text" id="goal-title" placeholder="Goal Name (e.g. Laptop)" required style="flex: 1; min-width: 150px;">
      <input type="number" id="goal-target" placeholder="Target (₹)" required style="width: 120px;">
      <input type="number" id="goal-saved" placeholder="Saved (₹)" required style="width: 120px;">
      <button type="submit" style="padding: 8px 14px; cursor: pointer; border-radius: 6px; background: #27ae60; color: white; border: none; font-weight: bold;">Add Goal</button>
    </form>
    <div class="goals-grid" id="goals-list">
      <!-- Dynamic Savings Goals Grid -->
    </div>
  </div>

  <div class="main-grid">
    <!-- Form -->
    <div class="form-card">
      <h2 class="section-title">Add New Transaction</h2>
      <form id="transaction-form" onsubmit="addTransaction(event)">
        <div class="form-group">
          <label for="desc">Description</label>
          <input type="text" id="desc" placeholder="e.g., Monthly Salary, Grocery" required>
        </div>
        <div class="form-group">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" placeholder="e.g., 5000" step="any" required>
        </div>
        <div class="form-group">
          <label for="type">Type</label>
          <select id="type" onchange="updateCategoryOptions()">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <!-- Dynamic Category Options -->
          </select>
        </div>
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <button type="submit" class="add-btn" id="add-btn">Add Transaction</button>
      </form>
    </div>

    <!-- Chart -->
    <div class="chart-card">
      <h2 class="section-title">Income vs Expense Chart</h2>
      <div class="chart-wrapper">
        <canvas id="financeChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Recent Transactions & Filters -->
  <div class="list-card">
    <div class="section-title">
      <span>Recent Transactions</span>
      <button class="export-btn" onclick="exportToCSV()">📥 Export CSV</button>
    </div>

    <div class="filter-bar">
      <select id="filter-category" onchange="applyFilters()">
        <option value="all">All Categories</option>
      </select>
      <input type="month" id="filter-month" onchange="applyFilters()">
      <button onclick="resetFilters()">Reset Filters</button>
    </div>

    <ul class="transaction-list" id="transaction-list">
      <li style="text-align: center; color: var(--subtext-color); padding: 20px;">Loading transactions...</li>
    </ul>
  </div>

  <script src="script.js?v=5"></script>
</body>
</html>
