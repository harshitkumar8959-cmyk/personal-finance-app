<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Personal Finance Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 22px;
      color: #2c3e50;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .user-email {
      font-weight: 600;
      color: #34495e;
    }
    .logout-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .logout-btn:hover {
      background-color: #c0392b;
    }
    .content-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
  </style>

  <!-- Firebase v9 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="header">
    <h1>Personal Finance Dashboard</h1>
    <div class="user-info">
      <span class="user-email" id="user-email-display">Loading user...</span>
      <button class="logout-btn" onclick="logoutUser()">Logout</button>
    </div>
  </div>

  <div class="content-box">
    <h2>Welcome!</h2>
    <p>Your authentication is fully secured. Next step: Add income and expense tracking modules.</p>
  </div>

  <!-- Include Updated Script -->
  <script src="script.js"></script>
</body>
</html>
