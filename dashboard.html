<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Personal Finance Manager</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --heading-color: #2c3e50;
      --subtext-color: #7f8c8d;
      --border-color: #dddddd;
      --item-bg: #f8f9fa;
      --shadow: rgba(0, 0, 0, 0.05);
    }

    body.dark-theme {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --heading-color: #ffffff;
      --subtext-color: #a0a0a0;
      --border-color: #333333;
      --item-bg: #2a2a2a;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }

    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 18px 25px; border-radius: 12px; box-shadow: 0 4px 10px var(--shadow); margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .header h1 { font-size: 20px; color: var(--heading-color); }
    .user-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .profile-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid #3498db; }
    .account-selector, .currency-selector { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-weight: bold; cursor: pointer; }

    .dark-mode-toggle { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
    .logout-btn { background-color: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    /* Modal Styling */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal-close { background: none; border: none; font-size: 20px; color: var(--text-color); cursor: pointer; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--subtext-color); }
    .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 6px; outline: none; }
    
    .btn-primary { width: 100%; background: #3498db; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    .btn-warning { width: 100%; background: #f39c12; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }

    /* Layout Grids */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px var(--shadow); }
    .card h3 { font-size: 13px; color: var(--subtext-color); margin-bottom: 10px; text-transform: uppercase; }
    .card p { font-size: 24px; font-weight: bold; }
    .balance-card p { color: var(--heading-color); }
    .income-card p { color: #2ecc71; }
    .expense-card p { color: #e74c3c; }

    .main-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; margin-bottom: 25px; }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

    .form-card, .list-card, .chart-card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px var(--shadow); }
    .section-title { font-size: 18px; color: var(--heading-color); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .action-buttons { display: flex; gap: 8px; }
    .add-btn { width: 100%; background-color: #3498db; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }

    .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .filter-bar select, .filter-bar input, .filter-bar button { padding: 8px 12px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 6px; font-size: 13px; }
    .search-input { flex: 1; min-width: 180px; }
    .export-btn { background-color: #27ae60; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .pdf-btn { background-color: #e74c3c; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

    .transaction-list { list-style: none; }
    .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-radius: 8px; background: var(--item-bg); margin-bottom: 10px; border-left: 5px solid #ccc; }
    .transaction-item.income { border-left-color: #2ecc71; }
    .transaction-item.expense { border-left-color: #e74c3c; }
    .item-title { font-weight: 600; color: var(--heading-color); display: flex; align-items: center; gap: 8px; }
    .item-meta { font-size: 11px; color: var(--subtext-color); margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .badge { background: var(--border-color); padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    .item-amount { font-weight: bold; }
    .item-amount.income { color: #2ecc71; }
    .item-amount.expense { color: #e74c3c; }
    .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 10px; }
    .chart-wrapper { position: relative; height: 260px; width: 100%; display: flex; justify-content: center; align-items: center; }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

  <!-- Chart.js Engine -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Top Header Navigation -->
  <div class="header">
    <h1>Personal Finance Dashboard</h1>
    <div class="user-info">
      <!-- Currency Switcher -->
      <select id="currency-selector" class="currency-selector" onchange="changeCurrency()">
        <option value="INR">₹ (INR)</option>
        <option value="USD">$ (USD)</option>
        <option value="EUR">€ (EUR)</option>
      </select>

      <!-- Account Filter -->
      <select id="global-account-filter" class="account-selector" onchange="applyFilters()">
        <option value="all">📁 All Accounts</option>
        <option value="Personal">👤 Personal</option>
        <option value="Family">👨‍👩‍👧 Family</option>
        <option value="Business">💼 Business</option>
      </select>

      <button class="dark-mode-toggle" id="theme-toggle-btn" onclick="toggleDarkMode()">🌙 Dark</button>
      
      <!-- Profile Picture Avatar & Name -->
      <img id="user-avatar" class="profile-avatar" src="https://via.placeholder.com/150" alt="Profile" onclick="openProfileModal()">
      <span class="user-email" id="user-display-name" style="font-weight:bold; cursor:pointer;" onclick="openProfileModal()">Loading...</span>
      
      <button class="logout-btn" onclick="logoutUser()">Logout</button>
    </div>
  </div>

  <!-- Profile & Security Settings Modal -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>User Profile & Security</h3>
        <button class="modal-close" onclick="closeProfileModal()">✖</button>
      </div>
      
      <!-- Profile Picture Upload -->
      <div class="form-group" style="text-align: center;">
        <img id="modal-avatar-preview" src="https://via.placeholder.com/150" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; border: 2px solid #3498db;">
        <input type="file" id="profile-pic-input" accept="image/*" style="font-size: 12px;">
        <button class="btn-primary" style="padding: 5px; font-size: 12px; margin-top: 5px;" onclick="uploadProfilePicture()">Upload Picture</button>
      </div>

      <!-- Update Name -->
      <div class="form-group">
        <label>Display Name</label>
        <input type="text" id="profile-name-input" placeholder="Enter Full Name">
        <button class="btn-primary" onclick="updateUserProfileName()">Update Name</button>
      </div>

      <hr style="margin: 15px 0; border: none; border-top: 1px solid var(--border-color);">

      <!-- Reset Password Section -->
      <div class="form-group">
        <label>Security Settings</label>
        <button class="btn-warning" onclick="sendPasswordResetEmail()">Reset Password via Email</button>
      </div>
    </div>
  </div>

  <!-- Dashboard Overview Cards -->
  <div class="summary-grid">
    <div class="card balance-card">
      <h3>Total Balance</h3>
      <p id="total-balance">₹0.00</p>
    </div>
    <div class="card income-card">
      <h3>Total Income</h3>
      <p id="total-income">₹0.00</p>
    </div>
    <div class="card expense-card">
      <h3>Total Expense</h3>
      <p id="total-expense">₹0.00</p>
    </div>
  </div>

  <!-- Main Content Grid -->
  <div class="main-grid">
    <!-- Form Section -->
    <div class="form-card">
      <h2 class="section-title">Add New Transaction</h2>
      <form id="transaction-form" onsubmit="addTransaction(event)">
        <div class="form-group">
          <label for="desc">Description</label>
          <input type="text" id="desc" placeholder="e.g., Monthly Salary, Grocery" required>
        </div>
        <div class="form-group">
          <label for="amount">Amount (<span class="currency-symbol">₹</span>)</label>
          <input type="number" id="amount" placeholder="e.g., 5000" step="any" required>
        </div>
        <div class="form-group">
          <label for="account">Account</label>
          <select id="account">
            <option value="Personal">👤 Personal</option>
            <option value="Family">👨‍👩‍👧 Family</option>
            <option value="Business">💼 Business</option>
          </select>
        </div>
        <div class="form-group">
          <label for="payment-mode">Payment Mode</label>
          <select id="payment-mode">
            <option value="UPI">📱 UPI</option>
            <option value="Cash">💵 Cash</option>
            <option value="Credit Card">💳 Credit Card</option>
            <option value="Debit Card">💳 Debit Card</option>
            <option value="Bank Transfer">🏦 Bank Transfer</option>
          </select>
        </div>
        <div class="form-group">
          <label for="type">Type</label>
          <select id="type" onchange="updateCategoryOptions()">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category"></select>
        </div>
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <button type="submit" class="add-btn" id="add-btn">Add Transaction</button>
      </form>
    </div>

    <!-- Chart Section -->
    <div class="chart-card">
      <h2 class="section-title">Income vs Expense Chart</h2>
      <div class="chart-wrapper">
        <canvas id="financeChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Transactions Table Section -->
  <div class="list-card">
    <div class="section-title">
      <span>Recent Transactions</span>
      <div class="action-buttons">
        <button class="export-btn" onclick="exportToCSV()">📥 CSV</button>
        <button class="pdf-btn" onclick="exportToPDF()">📄 PDF Report</button>
      </div>
    </div>

    <div class="filter-bar">
      <input type="text" id="search-query" class="search-input" placeholder="🔍 Search description..." oninput="applyFilters()">
      <select id="filter-category" onchange="applyFilters()"><option value="all">All Categories</option></select>
      <select id="filter-payment-mode" onchange="applyFilters()">
        <option value="all">All Payment Modes</option>
        <option value="UPI">UPI</option>
        <option value="Cash">Cash</option>
        <option value="Credit Card">Credit Card</option>
        <option value="Debit Card">Debit Card</option>
        <option value="Bank Transfer">Bank Transfer</option>
      </select>
      <input type="month" id="filter-month" onchange="applyFilters()">
      <button onclick="resetFilters()">Reset Filters</button>
    </div>

    <ul class="transaction-list" id="transaction-list">
      <li style="text-align: center; color: var(--subtext-color); padding: 20px;">Loading transactions...</li>
    </ul>
  </div>

  <script src="script.js?v=10"></script>
</body>
</html>
