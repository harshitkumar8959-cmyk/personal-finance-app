<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Personal Finance Management</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase CDN SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>

<body>

    <h1>Personal Finance Management</h1>

    <div class="dashboard">

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Welcome to Dashboard 👋</h2>
            <button onclick="logout()" style="background: #ff4d4d; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 4px; font-weight: bold;">Logout</button>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Total Income</h3>
                <p id="total-income">₹0</p>
            </div>

            <div class="card">
                <h3>Total Expense</h3>
                <p id="total-expense">₹0</p>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <p id="total-balance">₹0</p>
            </div>
        </div>

        <!-- Income vs Expense Chart -->
        <div style="width: 300px; margin: 30px auto;">
            <canvas id="financeChart"></canvas>
        </div>

        <h2>Recent Transactions</h2>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="transaction-list">
            </tbody>
        </table>
        
        <br>
        <p>
            <a href="add-transaction.html"><button>+ Add New Transaction</button></a>
        </p>

    </div>

    <script src="script.js"></script>
    
</body>
</html>
