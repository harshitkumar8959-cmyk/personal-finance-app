<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Personal Finance Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 18px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }
    .header h1 {
      font-size: 20px;
      color: #2c3e50;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .user-email {
      font-weight: 600;
      color: #34495e;
      font-size: 14px;
    }
    .logout-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .logout-btn:hover { background-color: #c0392b; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .card h3 {
      font-size: 14px;
      color: #7f8c8d;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .card p {
      font-size: 24px;
      font-weight: bold;
    }
    .balance-card p { color: #2c3e50; }
    .income-card p { color: #2ecc71; }
    .expense-card p { color: #e74c3c; }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 20px;
      margin-bottom: 25px;
    }
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .form-card, .list-card, .chart-card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .section-title {
      font-size: 18px;
      color: #2c3e50;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #555;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }
    .add-btn {
      width: 100%;
      background-color: #3498db;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .add-btn:hover { background-color: #2980b9; }

    /* Filters Section */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .filter-bar select, .filter-bar input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
    }

    .export-btn {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .export-btn:hover { background-color: #219150; }

    /* Transaction List */
    .transaction-list { list-style: none; }
    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      border-radius: 8px;
      background: #f8f9fa;
      margin-bottom: 10px;
      border-left: 5px solid #ccc;
    }
    .transaction-item.income { border-left-color: #2ecc71; }
    .transaction-item.expense { border-left-color: #e74c3c; }
    .item-title { font-weight: 600; color: #2c3e50; }
    .item-meta { font-size: 11px; color: #888; }
    .item-amount { font-weight: bold; }
    .item-amount.income { color: #2ecc71; }
    .item-amount.expense { color: #e74c3c; }
    .delete-btn {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      margin-left: 10px;
    }
    .delete-btn:hover { background-color: #cc0000; }

    .chart-container {
      position: relative;
      max-width: 320px;
      margin: 0 auto;
    }
  </style>

  <!-- Firebase v9 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="header">
    <h1>Personal Finance Dashboard</h1>
    <div class="user-info">
      <span class="user-email" id="user-email-display">Loading...</span>
      <button class="logout-btn" onclick="logoutUser()">Logout</button>
    </div>
  </div>

  <div class="summary-grid">
    <div class="card balance-card">
      <h3>Total Balance</h3>
      <p id="total-balance">₹0.00</p>
    </div>
    <div class="card income-card">
      <h3>Total Income</h3>
      <p id="total-income">₹0.00</p>
    </div>
    <div class="card expense-card">
      <h3>Total Expense</h3>
      <p id="total-expense">₹0.00</p>
    </div>
  </div>

  <div class="main-grid">
    <!-- Form -->
    <div class="form-card">
      <h2 class="section-title">Add New Transaction</h2>
      <form id="transaction-form" onsubmit="addTransaction(event)">
        <div class="form-group">
          <label for="desc">Description</label>
          <input type="text" id="desc" placeholder="e.g., Monthly Salary, Grocery" required>
        </div>
        <div class="form-group">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" placeholder="e.g., 5000" step="any" required>
        </div>
        <div class="form-group">
          <label for="type">Type</label>
          <select id="type" onchange="updateCategoryOptions()">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <!-- Dynamically populated -->
          </select>
        </div>
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <button type="submit" class="add-btn" id="add-btn">Add Transaction</button>
      </form>
    </div>

    <!-- Analytics Chart -->
    <div class="chart-card">
      <h2 class="section-title">Income vs Expense Chart</h2>
      <div class="chart-container">
        <canvas id="financeChart"></canvas>
      </div>
    </div>
  </div>

  <!-- History & Filters -->
  <div class="list-card">
    <div class="section-title">
      <span>Recent Transactions</span>
      <button class="export-btn" onclick="exportToCSV()">📥 Export CSV</button>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <select id="filter-category" onchange="applyFilters()">
        <option value="all">All Categories</option>
      </select>
      <input type="month" id="filter-month" onchange="applyFilters()">
      <button onclick="resetFilters()" style="padding: 8px 12px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc;">Reset Filters</button>
    </div>

    <ul class="transaction-list" id="transaction-list">
      <li style="text-align: center; color: #888; padding: 20px;">Loading transactions...</li>
    </ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
